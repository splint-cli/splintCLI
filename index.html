<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>splint — the neighborhood</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #e0e0e0;
    font-family: 'JetBrains Mono', monospace;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #1a1a1a;
    background: #0d0d0d;
    z-index: 10;
  }
  .logo { font-size: 18px; font-weight: 700; letter-spacing: 2px; }
  .logo span { color: #34d399; }
  .stats { font-size: 11px; color: #666; display: flex; gap: 16px; }
  .stats .val { color: #34d399; }
  #canvas-wrap {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }
  canvas {
    border-radius: 12px;
    image-rendering: pixelated;
    cursor: crosshair;
  }
  .pet-card {
    display: none;
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(13,13,13,0.95);
    border: 1px solid #222;
    border-radius: 12px;
    padding: 16px 20px;
    z-index: 20;
    min-width: 260px;
    backdrop-filter: blur(10px);
    font-family: 'JetBrains Mono', monospace;
  }
  .pet-card.active { display: block; }
  .pet-card h3 { font-size: 14px; margin-bottom: 4px; color: #34d399; }
  .pet-card .owner { font-size: 10px; color: #555; margin-bottom: 10px; }
  .stat-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 10px; }
  .stat-label { width: 65px; color: #777; }
  .stat-bar { flex: 1; height: 6px; background: #1a1a1a; border-radius: 3px; overflow: hidden; }
  .stat-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
  footer {
    padding: 8px 24px;
    text-align: center;
    font-size: 10px;
    color: #333;
    border-top: 1px solid #1a1a1a;
  }
  footer a { color: #34d399; text-decoration: none; }
</style>
</head>
<body>
<header>
  <div class="logo"><span>splint</span> — the neighborhood</div>
  <div class="stats">
    <div>pets: <span class="val" id="pet-count">0</span></div>
    <div>online: <span class="val" id="online-count">0</span></div>
    <div id="server-status" style="color:#666">connecting...</div>
  </div>
</header>

<div id="canvas-wrap">
  <canvas id="c" width="800" height="500"></canvas>
  <div class="pet-card" id="pet-card">
    <h3 id="card-name"></h3>
    <div class="owner" id="card-owner"></div>
    <div class="stat-row"><span class="stat-label">hunger</span><div class="stat-bar"><div class="stat-fill" id="bar-hunger" style="background:#f59e0b;width:50%"></div></div></div>
    <div class="stat-row"><span class="stat-label">happiness</span><div class="stat-bar"><div class="stat-fill" id="bar-happiness" style="background:#ec4899;width:50%"></div></div></div>
    <div class="stat-row"><span class="stat-label">energy</span><div class="stat-bar"><div class="stat-fill" id="bar-energy" style="background:#3b82f6;width:50%"></div></div></div>
    <div class="stat-row"><span class="stat-label">health</span><div class="stat-bar"><div class="stat-fill" id="bar-health" style="background:#22c55e;width:50%"></div></div></div>
  </div>
</div>

<footer>splint — living pixel world · <a href="https://github.com/splint-cli/splintCLI">github</a></footer>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const petCard = document.getElementById('pet-card');
const petCountEl = document.getElementById('pet-count');
const onlineCountEl = document.getElementById('online-count');

let pets = [];
let objects = [];
let selectedPet = null;
let frame = 0;

// ── Pixel Art Sprites (8x8 grids drawn programmatically) ──
const SPRITES = {
  cat: {
    color: '#f59e0b', dark: '#b45309',
    draw(ctx, x, y, s, facing, f) {
      const c = this.color, d = this.dark;
      const fx = facing === 'left' ? -1 : 1;
      ctx.save();
      ctx.translate(x, y);
      if (fx === -1) { ctx.scale(-1, 1); ctx.translate(-s * 8, 0); }
      // ears
      px(ctx, c, 1*s, 0, s); px(ctx, c, 2*s, 0, s);
      px(ctx, c, 5*s, 0, s); px(ctx, c, 6*s, 0, s);
      // head
      for (let i = 1; i <= 6; i++) px(ctx, c, i*s, 1*s, s);
      for (let i = 1; i <= 6; i++) px(ctx, c, i*s, 2*s, s);
      // eyes
      px(ctx, '#111', 2*s, 2*s, s); px(ctx, '#111', 5*s, 2*s, s);
      // nose
      px(ctx, '#ec4899', 3.5*s, 3*s, s*0.6);
      // body
      for (let i = 1; i <= 6; i++) { px(ctx, c, i*s, 3*s, s); px(ctx, c, i*s, 4*s, s); px(ctx, c, i*s, 5*s, s); }
      // belly
      px(ctx, '#fde68a', 3*s, 4*s, s); px(ctx, '#fde68a', 4*s, 4*s, s);
      // legs (animate)
      const walk = Math.sin(f * 0.3) > 0;
      px(ctx, d, 1*s, 6*s, s); px(ctx, d, 2*s, 6*s, s);
      px(ctx, d, 5*s, 6*s, s); px(ctx, d, 6*s, 6*s, s);
      if (walk) { px(ctx, d, 1*s, 7*s, s); px(ctx, d, 6*s, 7*s, s); }
      else { px(ctx, d, 2*s, 7*s, s); px(ctx, d, 5*s, 7*s, s); }
      // tail
      px(ctx, c, 7*s, 3*s, s); px(ctx, c, 7.5*s, 2*s, s);
      ctx.restore();
    }
  },
  dog: {
    color: '#3b82f6', dark: '#1d4ed8',
    draw(ctx, x, y, s, facing, f) {
      const c = this.color, d = this.dark;
      ctx.save();
      ctx.translate(x, y);
      if (facing === 'left') { ctx.scale(-1, 1); ctx.translate(-s * 8, 0); }
      // ears (floppy)
      px(ctx, d, 0, 1*s, s); px(ctx, d, 0, 2*s, s);
      px(ctx, d, 7*s, 1*s, s); px(ctx, d, 7*s, 2*s, s);
      // head
      for (let i = 1; i <= 6; i++) { px(ctx, c, i*s, 0, s); px(ctx, c, i*s, 1*s, s); px(ctx, c, i*s, 2*s, s); }
      // eyes
      px(ctx, '#111', 2*s, 1*s, s); px(ctx, '#111', 5*s, 1*s, s);
      // nose + tongue
      px(ctx, '#111', 3.5*s, 2.5*s, s*0.6);
      if (Math.sin(f * 0.1) > 0.5) px(ctx, '#ef4444', 3.5*s, 3.2*s, s*0.5);
      // body
      for (let i = 1; i <= 6; i++) { px(ctx, c, i*s, 3*s, s); px(ctx, c, i*s, 4*s, s); px(ctx, c, i*s, 5*s, s); }
      // belly
      px(ctx, '#93c5fd', 3*s, 4*s, s); px(ctx, '#93c5fd', 4*s, 4*s, s);
      // legs
      const walk = Math.sin(f * 0.3) > 0;
      px(ctx, d, 1*s, 6*s, s); px(ctx, d, 2*s, 6*s, s); px(ctx, d, 5*s, 6*s, s); px(ctx, d, 6*s, 6*s, s);
      if (walk) { px(ctx, d, 1*s, 7*s, s); px(ctx, d, 6*s, 7*s, s); }
      else { px(ctx, d, 2*s, 7*s, s); px(ctx, d, 5*s, 7*s, s); }
      // tail (wagging)
      const wag = Math.sin(f * 0.4) * 0.5;
      px(ctx, c, 7*s, (3 + wag)*s, s); px(ctx, c, 7.5*s, (2 + wag)*s, s);
      ctx.restore();
    }
  },
  bunny: {
    color: '#ec4899', dark: '#be185d',
    draw(ctx, x, y, s, facing, f) {
      const c = this.color, d = this.dark;
      ctx.save();
      ctx.translate(x, y);
      if (facing === 'left') { ctx.scale(-1, 1); ctx.translate(-s * 8, 0); }
      // long ears
      px(ctx, c, 2*s, -2*s, s); px(ctx, c, 2*s, -1*s, s); px(ctx, '#fbb', 2.3*s, -1.5*s, s*0.4);
      px(ctx, c, 5*s, -2*s, s); px(ctx, c, 5*s, -1*s, s); px(ctx, '#fbb', 5.3*s, -1.5*s, s*0.4);
      // head
      for (let i = 1; i <= 6; i++) { px(ctx, c, i*s, 0, s); px(ctx, c, i*s, 1*s, s); px(ctx, c, i*s, 2*s, s); }
      // eyes
      px(ctx, '#111', 2*s, 1*s, s); px(ctx, '#111', 5*s, 1*s, s);
      // cheeks
      px(ctx, '#fbb', 1*s, 2*s, s); px(ctx, '#fbb', 6*s, 2*s, s);
      // body (rounder)
      for (let i = 2; i <= 5; i++) { px(ctx, c, i*s, 3*s, s); px(ctx, c, i*s, 4*s, s); }
      for (let i = 1; i <= 6; i++) px(ctx, c, i*s, 5*s, s);
      // belly
      px(ctx, '#fce7f3', 3*s, 4*s, s); px(ctx, '#fce7f3', 4*s, 4*s, s);
      // feet (bouncy)
      const bounce = Math.abs(Math.sin(f * 0.35)) * s;
      px(ctx, d, 2*s, 6*s - bounce, s); px(ctx, d, 5*s, 6*s - bounce, s);
      // tail puff
      px(ctx, '#fff', 6.5*s, 4*s, s*0.8);
      ctx.restore();
    }
  },
  hamster: {
    color: '#f97316', dark: '#c2410c',
    draw(ctx, x, y, s, facing, f) {
      const c = this.color;
      ctx.save();
      ctx.translate(x, y);
      if (facing === 'left') { ctx.scale(-1, 1); ctx.translate(-s * 8, 0); }
      // round ears
      px(ctx, c, 1*s, 0, s); px(ctx, c, 6*s, 0, s);
      // head (big round)
      for (let i = 1; i <= 6; i++) { px(ctx, c, i*s, 1*s, s); px(ctx, c, i*s, 2*s, s); px(ctx, c, i*s, 3*s, s); }
      // cheeks (puffy!)
      px(ctx, '#fed7aa', 0, 2*s, s); px(ctx, '#fed7aa', 0, 3*s, s);
      px(ctx, '#fed7aa', 7*s, 2*s, s); px(ctx, '#fed7aa', 7*s, 3*s, s);
      // eyes (beady)
      px(ctx, '#111', 2*s, 2*s, s*0.7); px(ctx, '#111', 5*s, 2*s, s*0.7);
      // nose
      px(ctx, '#d97706', 3.5*s, 3*s, s*0.5);
      // body (small)
      for (let i = 2; i <= 5; i++) { px(ctx, c, i*s, 4*s, s); px(ctx, c, i*s, 5*s, s); }
      px(ctx, '#fff5eb', 3*s, 4.5*s, s); px(ctx, '#fff5eb', 4*s, 4.5*s, s);
      // feet (tiny wobble)
      const w = Math.sin(f * 0.4) > 0;
      px(ctx, this.dark, 2*s, 6*s, s*0.7); px(ctx, this.dark, 5*s, 6*s, s*0.7);
      ctx.restore();
    }
  },
  bird: {
    color: '#06b6d4', dark: '#0e7490',
    draw(ctx, x, y, s, facing, f) {
      const c = this.color;
      ctx.save();
      ctx.translate(x, y);
      if (facing === 'left') { ctx.scale(-1, 1); ctx.translate(-s * 8, 0); }
      // head
      for (let i = 2; i <= 5; i++) { px(ctx, c, i*s, 0, s); px(ctx, c, i*s, 1*s, s); }
      // eye
      px(ctx, '#111', 4*s, 0.5*s, s*0.7);
      // beak
      px(ctx, '#fbbf24', 6*s, 1*s, s); px(ctx, '#fbbf24', 7*s, 1*s, s*0.5);
      // body
      for (let i = 1; i <= 6; i++) { px(ctx, c, i*s, 2*s, s); px(ctx, c, i*s, 3*s, s); }
      px(ctx, '#a5f3fc', 3*s, 3*s, s); px(ctx, '#a5f3fc', 4*s, 3*s, s);
      // wing (flapping)
      const flap = Math.sin(f * 0.5);
      px(ctx, this.dark, 0, (2 + flap*0.5)*s, s); px(ctx, this.dark, 0, (3 + flap*0.3)*s, s);
      // tail
      px(ctx, this.dark, 1*s, 4*s, s); px(ctx, this.dark, 0, 4*s, s);
      // feet
      px(ctx, '#fbbf24', 3*s, 4*s, s*0.6); px(ctx, '#fbbf24', 5*s, 4*s, s*0.6);
      ctx.restore();
    }
  },
  fox: {
    color: '#ef4444', dark: '#b91c1c',
    draw(ctx, x, y, s, facing, f) {
      const c = this.color, d = this.dark;
      ctx.save();
      ctx.translate(x, y);
      if (facing === 'left') { ctx.scale(-1, 1); ctx.translate(-s * 8, 0); }
      // pointy ears
      px(ctx, c, 1*s, -1*s, s); px(ctx, '#111', 1.3*s, -0.5*s, s*0.4);
      px(ctx, c, 6*s, -1*s, s); px(ctx, '#111', 6.3*s, -0.5*s, s*0.4);
      // head
      for (let i = 1; i <= 6; i++) { px(ctx, c, i*s, 0, s); px(ctx, c, i*s, 1*s, s); }
      // white muzzle
      px(ctx, '#fff', 3*s, 1*s, s); px(ctx, '#fff', 4*s, 1*s, s);
      // eyes (sly)
      px(ctx, '#fbbf24', 2*s, 0.5*s, s*0.7); px(ctx, '#111', 2.2*s, 0.5*s, s*0.3);
      px(ctx, '#fbbf24', 5*s, 0.5*s, s*0.7); px(ctx, '#111', 5.2*s, 0.5*s, s*0.3);
      // body
      for (let i = 1; i <= 6; i++) { px(ctx, c, i*s, 2*s, s); px(ctx, c, i*s, 3*s, s); px(ctx, c, i*s, 4*s, s); }
      px(ctx, '#fff', 3*s, 3*s, s); px(ctx, '#fff', 4*s, 3*s, s);
      // legs
      const walk = Math.sin(f * 0.3) > 0;
      px(ctx, d, 1*s, 5*s, s); px(ctx, d, 2*s, 5*s, s); px(ctx, d, 5*s, 5*s, s); px(ctx, d, 6*s, 5*s, s);
      if (walk) { px(ctx, '#111', 1*s, 6*s, s); px(ctx, '#111', 6*s, 6*s, s); }
      else { px(ctx, '#111', 2*s, 6*s, s); px(ctx, '#111', 5*s, 6*s, s); }
      // big fluffy tail
      px(ctx, c, 7*s, 2*s, s); px(ctx, c, 7.5*s, 1.5*s, s); px(ctx, '#fff', 7.8*s, 1*s, s);
      ctx.restore();
    }
  },
  turtle: {
    color: '#22c55e', dark: '#15803d',
    draw(ctx, x, y, s, facing, f) {
      const c = this.color, d = this.dark;
      ctx.save();
      ctx.translate(x, y);
      if (facing === 'left') { ctx.scale(-1, 1); ctx.translate(-s * 8, 0); }
      // head
      px(ctx, '#86efac', 6*s, 1*s, s); px(ctx, '#86efac', 7*s, 1*s, s);
      px(ctx, '#86efac', 6*s, 2*s, s); px(ctx, '#86efac', 7*s, 2*s, s);
      px(ctx, '#111', 7*s, 1.3*s, s*0.4);
      // shell
      for (let i = 1; i <= 5; i++) { px(ctx, c, i*s, 1*s, s); px(ctx, d, i*s, 2*s, s); px(ctx, c, i*s, 3*s, s); }
      // shell pattern
      px(ctx, '#166534', 2*s, 2*s, s); px(ctx, '#166534', 4*s, 2*s, s);
      // legs (slow wobble)
      const w = Math.sin(f * 0.15) > 0;
      px(ctx, '#86efac', 1*s, 4*s, s); px(ctx, '#86efac', 5*s, 4*s, s);
      if (w) { px(ctx, '#86efac', 2*s, 4*s, s); } else { px(ctx, '#86efac', 4*s, 4*s, s); }
      // tail
      px(ctx, '#86efac', 0, 3*s, s*0.6);
      ctx.restore();
    }
  },
  penguin: {
    color: '#8b5cf6', dark: '#6d28d9',
    draw(ctx, x, y, s, facing, f) {
      const c = this.color, d = this.dark;
      ctx.save();
      ctx.translate(x, y);
      if (facing === 'left') { ctx.scale(-1, 1); ctx.translate(-s * 8, 0); }
      // head
      for (let i = 2; i <= 5; i++) { px(ctx, c, i*s, 0, s); px(ctx, c, i*s, 1*s, s); }
      // eyes
      px(ctx, '#fff', 2.5*s, 0.5*s, s*0.8); px(ctx, '#111', 2.8*s, 0.5*s, s*0.4);
      px(ctx, '#fff', 4.5*s, 0.5*s, s*0.8); px(ctx, '#111', 4.8*s, 0.5*s, s*0.4);
      // beak
      px(ctx, '#fbbf24', 3.5*s, 1.5*s, s*0.6);
      // body
      for (let i = 1; i <= 6; i++) { px(ctx, c, i*s, 2*s, s); px(ctx, c, i*s, 3*s, s); px(ctx, c, i*s, 4*s, s); }
      // white belly
      px(ctx, '#fff', 3*s, 3*s, s); px(ctx, '#fff', 4*s, 3*s, s);
      px(ctx, '#fff', 3*s, 4*s, s); px(ctx, '#fff', 4*s, 4*s, s);
      // flippers (waddle)
      const waddle = Math.sin(f * 0.3) * 0.5;
      px(ctx, d, 1*s, (2.5 + waddle)*s, s); px(ctx, d, 0, (3 + waddle)*s, s);
      px(ctx, d, 6*s, (2.5 - waddle)*s, s); px(ctx, d, 7*s, (3 - waddle)*s, s);
      // feet
      px(ctx, '#fbbf24', 2.5*s, 5*s, s); px(ctx, '#fbbf24', 4.5*s, 5*s, s);
      ctx.restore();
    }
  }
};

function px(ctx, color, x, y, size) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x), Math.round(y), Math.ceil(size), Math.ceil(size));
}

// ── Decoration sprites ──
const DECOR = {
  tree(ctx, x, y) {
    // trunk
    px(ctx, '#92400e', x+8, y+16, 4); px(ctx, '#92400e', x+8, y+20, 4);
    // leaves
    for (let i = 0; i < 20; i += 4) px(ctx, '#166534', x+i, y+8, 4);
    for (let i = 2; i < 18; i += 4) px(ctx, '#15803d', x+i, y+4, 4);
    for (let i = 4; i < 16; i += 4) px(ctx, '#22c55e', x+i, y, 4);
  },
  flower(ctx, x, y) {
    px(ctx, '#22c55e', x+4, y+8, 3); px(ctx, '#22c55e', x+4, y+11, 3);
    px(ctx, '#f472b6', x+4, y+2, 4);
    px(ctx, '#ec4899', x+1, y+4, 3); px(ctx, '#ec4899', x+8, y+4, 3);
    px(ctx, '#fbbf24', x+4, y+4, 3);
  },
  pond(ctx, x, y) {
    ctx.fillStyle = 'rgba(56, 189, 248, 0.3)';
    ctx.beginPath(); ctx.ellipse(x+16, y+10, 20, 12, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(56, 189, 248, 0.5)';
    ctx.beginPath(); ctx.ellipse(x+16, y+10, 14, 8, 0, 0, Math.PI*2); ctx.fill();
  },
  rock(ctx, x, y) {
    px(ctx, '#6b7280', x+2, y+4, 6); px(ctx, '#6b7280', x+0, y+8, 10);
    px(ctx, '#9ca3af', x+2, y+4, 4); px(ctx, '#4b5563', x+6, y+8, 4);
  },
  bench(ctx, x, y) {
    px(ctx, '#92400e', x, y+4, 20, 3);
    px(ctx, '#78350f', x+2, y+8, 3); px(ctx, '#78350f', x+14, y+8, 3);
    px(ctx, '#78350f', x+2, y+12, 3); px(ctx, '#78350f', x+14, y+12, 3);
  },
  food(ctx, x, y) {
    ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(x+6, y+6, 5, 0, Math.PI*2); ctx.fill();
    px(ctx, '#22c55e', x+5, y, 3);
    ctx.fillStyle = '#fff'; ctx.fillRect(x+3, y+4, 2, 1);
  },
  ball(ctx, x, y) {
    ctx.fillStyle = '#3b82f6'; ctx.beginPath(); ctx.arc(x+6, y+6, 6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(x+2, y+3, 3, 1); ctx.fillRect(x+7, y+7, 3, 1);
  }
};

// ── Rendering ──
const PIXEL = 3; // each pixel unit = 3 screen pixels

function drawGrass(ctx) {
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, 800, 500);
  // subtle grass dots
  ctx.fillStyle = '#0f1a0f';
  for (let i = 0; i < 200; i++) {
    const gx = (i * 137 + 50) % 800;
    const gy = (i * 211 + 30) % 500;
    ctx.fillRect(gx, gy, 2, 2);
  }
  // paths
  ctx.fillStyle = '#1a1610';
  ctx.globalAlpha = 0.6;
  ctx.fillRect(80, 240, 640, 16);
  ctx.fillRect(390, 80, 16, 340);
  ctx.fillRect(180, 160, 16, 180);
  ctx.fillRect(600, 160, 16, 180);
  ctx.globalAlpha = 1;
}

function drawObjects(ctx) {
  for (const obj of objects) {
    const fn = DECOR[obj.type];
    if (fn) fn(ctx, obj.x, obj.y);
  }
}

function drawPets(ctx) {
  for (const pet of pets) {
    const sprite = SPRITES[pet.species] || SPRITES.cat;
    sprite.draw(ctx, pet.nx - 12, pet.ny - 12, PIXEL, pet.facing || 'right', frame);

    // name tag
    ctx.font = '9px "JetBrains Mono", monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    const nameW = ctx.measureText(pet.name).width + 8;
    ctx.fillRect(pet.nx - nameW/2, pet.ny - 24, nameW, 12);
    ctx.fillStyle = '#aaa';
    ctx.fillText(pet.name, pet.nx, pet.ny - 15);

    // speech bubble
    if (pet.bubble) {
      const bw = ctx.measureText(pet.bubble).width + 12;
      const bx = pet.nx - bw/2;
      const by = pet.ny - 42;
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      roundRect(ctx, bx, by, bw, 16, 6);
      ctx.fill();
      // triangle
      ctx.beginPath();
      ctx.moveTo(pet.nx - 4, by + 16);
      ctx.lineTo(pet.nx + 4, by + 16);
      ctx.lineTo(pet.nx, by + 20);
      ctx.fill();
      ctx.fillStyle = '#111';
      ctx.font = '10px "JetBrains Mono", monospace';
      ctx.fillText(pet.bubble, pet.nx, by + 12);
    }
  }
  ctx.textAlign = 'left';
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
}

function drawEmpty(ctx) {
  if (pets.length > 0) return;
  ctx.textAlign = 'center';
  ctx.font = '40px serif';
  ctx.fillStyle = '#333';
  ctx.fillText('🥚', 400, 230);
  ctx.font = '12px "JetBrains Mono", monospace';
  ctx.fillText('no pets yet. hatch one:', 400, 270);
  ctx.fillStyle = '#34d399';
  ctx.fillText('python pet.py', 400, 290);
  ctx.textAlign = 'left';
}

function render() {
  frame++;
  drawGrass(ctx);
  drawObjects(ctx);
  drawPets(ctx);
  drawEmpty(ctx);
  requestAnimationFrame(render);
}

// ── Click to inspect ──
canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  let found = null;
  for (const pet of pets) {
    const dx = mx - pet.nx;
    const dy = my - pet.ny;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) { found = pet; break; }
  }

  if (found) {
    selectedPet = found.id;
    petCard.classList.add('active');
    document.getElementById('card-name').textContent = `${found.name}`;
    document.getElementById('card-owner').textContent = `owner: ${found.owner} · level ${found.level || 1} · ${found.species}`;
    document.getElementById('bar-hunger').style.width = found.hunger + '%';
    document.getElementById('bar-happiness').style.width = found.happiness + '%';
    document.getElementById('bar-energy').style.width = found.energy + '%';
    document.getElementById('bar-health').style.width = found.health + '%';
  } else {
    petCard.classList.remove('active');
    selectedPet = null;
  }
});

// ── Server URL resolution ──
let serverUrl = '';
let ws, wsOk = false, poll = null;

async function resolveServer() {
  // If we're on the server itself (localhost/tunnel), use that
  if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
    serverUrl = location.origin;
    connect();
    return;
  }
  // On GitHub Pages — fetch server-url.json
  try {
    const r = await fetch('https://raw.githubusercontent.com/splint-cli/splintCLI/main/server-url.json?t=' + Date.now());
    const d = await r.json();
    if (d.url) {
      serverUrl = d.url.replace(/\/$/, '');
      document.getElementById('server-status').textContent = '● live';
      document.getElementById('server-status').style.color = '#34d399';
      connect();
    }
  } catch(e) {
    document.getElementById('server-status').textContent = '○ offline';
    document.getElementById('server-status').style.color = '#666';
    startPoll();
  }
}

function connect() {
  if (!serverUrl) return;
  try {
    const wsUrl = serverUrl.replace('https://', 'wss://').replace('http://', 'ws://');
    ws = new WebSocket(wsUrl);
    ws.onopen = () => { wsOk = true; if (poll) { clearInterval(poll); poll = null; } };
    ws.onmessage = (e) => {
      const d = JSON.parse(e.data);
      if (d.pets) pets = d.pets;
      if (d.objects) objects = d.objects;
      petCountEl.textContent = pets.length;
      onlineCountEl.textContent = pets.filter(p => Date.now() - p.lastSeen < 300000).length;
    };
    ws.onclose = () => { wsOk = false; startPoll(); setTimeout(connect, 5000); };
    ws.onerror = () => ws.close();
  } catch(e) { startPoll(); }
}

function startPoll() {
  if (poll || !serverUrl) return;
  poll = setInterval(async () => {
    try {
      const r = await fetch(serverUrl + '/api/state');
      const d = await r.json();
      if (d.pets) pets = d.pets;
      if (d.objects) objects = d.objects;
      petCountEl.textContent = pets.length;
    } catch(e) {}
  }, 500);
}

resolveServer();
render();
</script>
